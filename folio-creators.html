      p.newNode.dataset.hold='1';
      p.newNode.style.filter='none';

      if(same){
        /* Одинаковое содержимое: едет один живой узел, передача в один кадр,
           без призрака и без паузы в конце. */
        p.newNode.style.opacity='0';
        p.newNode.style.transform=rot(p.newE);
        anim(p.oldNode,[start,end],{duration:dur,easing:EASE,fill:'forwards'});
        if(p.oldE.type==='text'){
          var t=p.oldNode.querySelector('.wdp-txt');
          if(t) anim(t,[textStartKF(t),{fontSize:(p.newE.fs||32)+'px',color:p.newE.color||'#111'}],
            {duration:dur,easing:EASE,fill:'forwards'});
        }
        if(p.oldE.type==='rect'){
          var ca=plainColor(p.oldE.bg), cb=plainColor(p.newE.bg);
          if(ca!==null&&cb!==null&&ca!==cb)
            anim(p.oldNode,[{backgroundColor:ca},{backgroundColor:cb}],{duration:dur,easing:EASE,fill:'forwards'});
        }
        /* у виджета меняется размер контейнера — ResizeObserver внутри
           перерисует содержимое, сам документ не пересоздаётся */
      }else{
        /* Разное содержимое: оба узла едут по одной траектории, содержимое
           мягко перетекает прямо в движении — без «старый доехал → щёлк». */
        p.newNode.style.opacity='0';
        p.newNode.style.left=start.left; p.newNode.style.top=start.top;
        p.newNode.style.width=start.width; p.newNode.style.height=start.height;
        p.newNode.style.borderRadius=start.borderRadius;
        p.newNode.style.transform=start.transform;
        var oldEnd={}; for(var k in end) oldEnd[k]=end[k]; oldEnd.opacity=0;
        var newStart={}; for(var k2 in start) newStart[k2]=start[k2]; newStart.opacity=0;
        anim(p.oldNode,[start,oldEnd],{duration:dur,easing:EASE,fill:'forwards'});
        anim(p.newNode,[newStart,end],{duration:dur,easing:EASE,fill:'forwards'});
        if(p.oldE.type==='text'&&p.newE.type==='text'){
          var ot=p.oldNode.querySelector('.wdp-txt'), nt=p.newNode.querySelector('.wdp-txt');
          var ts=ot?textStartKF(ot):{fontSize:(p.oldE.fs||32)+'px',color:p.oldE.color||'#111'};
          var te={fontSize:(p.newE.fs||32)+'px',color:p.newE.color||'#111'};
          if(ot) anim(ot,[ts,te],{duration:dur,easing:EASE,fill:'forwards'});
          if(nt) anim(nt,[ts,te],{duration:dur,easing:EASE,fill:'forwards'});
        }
      }
    });
  }

  function ui(){
    count.textContent=(idx+1)+' / '+deck.slides.length;
    prog.style.width=((idx+1)/deck.slides.length*100)+'%';
    notesEl.textContent=deck.slides[idx].notes||'Заметок нет';
  }
  function show(i,withEnter){
    gen++;
    busy=false; activeFinish=null;
    transAnims.forEach(function(a){try{a.cancel();}catch(e){}}); transAnims=[];
    stage.querySelectorAll('.wdp-layer').forEach(function(l){ sleep(l); cancelLayerAnims(l); l.remove(); });
    morph.innerHTML='';
    idx=clamp(i,0,deck.slides.length-1);
    var instant=reduced();
    cur=build(deck.slides[idx],withEnter&&!instant,idx);
    stage.insertBefore(cur,morph); ui();
    if(withEnter&&!instant)enter(cur,deck.slides[idx],150);
    wakeSoon(cur);
  }
    function go(i){
    if(isModalOpen())return;
    var n=deck.slides.length;
    if(cfg.loop){ if(i>=n)i=0; else if(i<0)i=n-1; }
    i=clamp(i,0,n-1);
    if(dead||i===idx)return;
    /* Быстрое листание: прерываем текущую фазу чистым снапом в целевой слайд
       и сразу стартуем следующую — без наложений слоёв и залипания навигации. */
    if(busy){ if(activeFinish) activeFinish(); else return; }
    var myGen=++gen;
    var fromI=idx, oldSl=deck.slides[fromI], toSl=deck.slides[i];
    var tr=toSl.transition||'morph';
    var dur=toSl.transitionDur!=null?toSl.transitionDur:(TRANS[tr]||900);
    var old=cur;
    var instant=(tr==='cut'||dur<=0||reduced());
    var L=build(toSl,!instant,i);
    L.style.opacity='0';
    stage.insertBefore(L,morph); idx=i; ui();
    wakeSoon(L);

    var pairs=(tr==='morph'&&!instant)?morphPairs(oldSl,toSl,old,L):[];
    if(tr==='morph'&&!pairs.length&&!instant) tr='fade';   /* нечего морфить — честный кроссфейд */

    if(instant){
      /* Cut и prefers-reduced-motion: мгновенная смена, без фаз исчезания/появления. */
      sleep(old); cancelLayerAnims(old); old.remove(); cur=L;
      L.style.opacity='1'; wakeSoon(L); return;
    }

    busy=true;
    var jobs=[];
    function anim(el,kf,o){var a=el.animate(kf,o);transAnims.push(a);jobs.push(a.finished.catch(function(){}));return a;}

    var finished=false;
    function finalize(){
      if(finished||dead||myGen!==gen)return;
      finished=true; activeFinish=null;
      /* Один кадр: новые узлы в финальном состоянии, старый слой исчезает.
         Никакого дополнительного кроссфейда — призрак не появляется. */
      (toSl.elements||[]).forEach(function(e){
        var nn=node(L,e.id); if(!nn)return;
        var F=fin(e);
        nn.style.left=e.x+'px'; nn.style.top=e.y+'px'; nn.style.width=e.w+'px'; nn.style.height=e.h+'px';
        nn.style.borderRadius=(e.rad||0)+'px';
        nn.style.opacity=F.opacity; nn.style.transform=F.transform; nn.style.filter='none';
        if(e.type==='rect') nn.style.background=e.bg||'#ccc';
        if(e.type==='text'){var t=nn.querySelector('.wdp-txt'); if(t){t.style.fontSize=(e.fs||32)+'px'; t.style.color=e.color||'#111';}}
        delete nn.dataset.hold; delete nn.dataset.pending;
      });
      transAnims.forEach(function(a){try{a.cancel();}catch(e){}}); transAnims=[];
      sleep(old); cancelLayerAnims(old); old.remove(); morph.innerHTML='';
      L.style.opacity='1'; L.style.transform='none'; L.style.filter='none'; L.style.zIndex='';
      cur=L; busy=false;
      wakeSoon(L);
    }
    activeFinish=finalize;

    /* Фаза 1 — исчезания (дефолт none). Пары Morph ID не исчезают — они перетекают.
       Стартовый кадр берётся из текущего вычисленного состояния узла, чтобы при
       быстром листании не было вспышки полной видимости перед гашением. */
    var pairedOld={}, exiting={};
    pairs.forEach(function(p){ pairedOld[p.oldE.id]=1; });
    var exitTotal=0;
    (oldSl.elements||[]).forEach(function(e){
      if(pairedOld[e.id])return;
      var kf=exitTo(e); if(!kf)return;
      var nd=node(old,e.id); if(!nd)return;
      var cs=getComputedStyle(nd);
      var a=nd.animate([{opacity:cs.opacity,transform:cs.transform,filter:cs.filter},kf],
        {duration:e.exitDur||450,delay:e.exitDelay||0,easing:EASE,fill:'forwards'});
      transAnims.push(a);
      exiting[e.id]=1;
      exitTotal=Math.max(exitTotal,(e.exitDelay||0)+(e.exitDur||450));
    });
    /* Переход стартует на ~60% исчезаний, а не после их полного завершения:
       фазы перекрываются, пустых моментов и ощущения зависания нет. */
    var exitWait=exitTotal>0?Math.round(exitTotal*0.6):0;

    function startTransition(){
      if(dead||myGen!==gen||finished)return;
      if(tr==='morph'){
        L.style.opacity='1';
        runMorph(pairs,old,L,oldSl,toSl,dur,anim,exiting);
        enter(L,toSl,Math.round(dur*0.5));
      }else{
        var dir=i>fromI?1:-1, ok, nk;
        if(tr==='zoom'){ok=[{opacity:1,transform:'scale(1)'},{opacity:0,transform:'scale(1.12)'}];nk=[{opacity:0,transform:'scale(.88)'},{opacity:1,transform:'scale(1)'}];}
        else if(tr==='blur'){ok=[{opacity:1,filter:'blur(0px)'},{opacity:0,filter:'blur(26px)'}];nk=[{opacity:0,filter:'blur(26px)'},{opacity:1,filter:'blur(0px)'}];}
        else if(tr==='slide'){ok=[{transform:'translateX(0)'},{transform:'translateX('+(-dir*100)+'%)'}];nk=[{transform:'translateX('+(dir*100)+'%)'},{transform:'translateX(0)'}];L.style.opacity='1';}
        else if(tr==='parallax'){ok=[{opacity:1,transform:'translateX(0) scale(1)'},{opacity:0,transform:'translateX('+(-dir*28)+'%) scale(.94)'}];nk=[{opacity:0,transform:'translateX('+(dir*36)+'%) scale(1.04)'},{opacity:1,transform:'translateX(0) scale(1)'}];}
        else{ok=[{opacity:1},{opacity:0}];nk=[{opacity:0},{opacity:1}];}
        anim(old,ok,{duration:dur,easing:EASE,fill:'forwards'});
        anim(L,nk,{duration:dur,easing:EASE,fill:'forwards'});
        enter(L,toSl,Math.round(dur*0.5));
      }
      var settled=false;
      function settle(){
        if(settled||dead||myGen!==gen)return;
        settled=true; finalize();
      }
      Promise.all(jobs).then(settle);
      setTimeout(settle,dur+140);
    }
    if(exitWait>0) setTimeout(startTransition,exitWait); else startTransition();
  }


  /* ---------- панель управления ---------- */
  function toast(msg,ms){
    toastEl.textContent=msg; toastEl.classList.add('on');
    clearTimeout(toastT); toastT=setTimeout(function(){toastEl.classList.remove('on');},ms||2200);
  }
  function schedule(){
    clearTimeout(hideT);
    if(cfg.controls==='always'||inHot||overBar||focusBar)return;
    hideT=setTimeout(function(){barOff();},cfg.hideDelay);
  }
  function barOn(){
    if(cfg.controls==='hidden')return;
    barVisible=true; bar.classList.add('on'); hint.classList.remove('on');
    area.classList.remove('wdp-nocursor'); clearTimeout(cursorT);
    schedule();
  }
  function barOff(force){
    if(!force&&(cfg.controls==='always'||inHot||overBar||focusBar))return;
    clearTimeout(hideT);
    barVisible=false; bar.classList.remove('on');
    hint.classList.toggle('on',!!cfg.hint&&cfg.controls!=='always');
    if(cfg.hideCursor)area.classList.add('wdp-nocursor');
  }
  function modeLabel(){return cfg.controls==='auto'?'Авто':cfg.controls==='always'?'Всегда':'Скрыто';}
  function setMode(m,quiet){
    cfg.controls=m; if(opts.onCfg)opts.onCfg('controls',m);
    applyCfg();
    if(!quiet)toast('Панель: '+(m==='auto'?'автоскрытие':m==='always'?'всегда видна':'скрыта · H — вернуть'));
  }
  function setLoop(on,quiet){
    cfg.loop=!!on; if(opts.onCfg)opts.onCfg('loop',cfg.loop);
    loopBtn.classList.toggle('on',cfg.loop);
    if(!quiet)toast('По кругу: '+(cfg.loop?'включён':'выключен'));
  }
  function applyCfg(){
    mount.classList.toggle('wdp-top',cfg.pos==='top');
    hot.style.height=cfg.hotZone+'px';
    prog.style.display=cfg.progress?'block':'none';
    count.style.display=cfg.counter?'inline-block':'none';
    modeBtn.textContent=modeLabel();
    modeBtn.classList.toggle('on',cfg.controls!=='auto');
    loopBtn.classList.toggle('on',!!cfg.loop);
    clearTimeout(hideT); clearTimeout(cursorT);
    area.classList.remove('wdp-nocursor');
    if(cfg.controls==='always'){barVisible=true;bar.classList.add('on');hint.classList.remove('on');}
    else if(cfg.controls==='hidden'){barOff(true);}
    else{barOn();}
  }
  function move(ev){
    if(dead||ev.pointerType==='touch')return;
    var r=area.getBoundingClientRect(), y=ev.clientY-r.top;
    var hotNow=cfg.pos==='top'? y<=cfg.hotZone : y>=r.height-cfg.hotZone;
    var overWidget=!!(ev.target&&ev.target.closest&&ev.target.closest('iframe'));
    if(!overWidget){
      area.classList.remove('wdp-nocursor');
      clearTimeout(cursorT);
      if(cfg.hideCursor)cursorT=setTimeout(function(){if(!barVisible&&!inHot&&!overBar)area.classList.add('wdp-nocursor');},cfg.hideDelay);
    }
    if(hotNow!==inHot){inHot=hotNow; if(inHot)barOn(); else schedule();}
  }
  function leaveArea(){inHot=false;overBar=false;schedule();}
  var sx=null,sy=null,st=0,stype='';
  function pd(ev){
    if(isModalOpen())return;
    if(ev.target.closest('.wdp-bar')||ev.target.closest('.wdp-hint')||ev.target.closest('iframe'))return;
    sx=ev.clientX;sy=ev.clientY;st=Date.now();stype=ev.pointerType;
  }
  function pu(ev){
    if(isModalOpen()||sx==null)return;
    var dx=ev.clientX-sx,dy=ev.clientY-sy,dt=Date.now()-st; sx=null;
    if(Math.abs(dx)>60&&Math.abs(dx)>Math.abs(dy)){go(idx+(dx<0?1:-1));return;}
    if(stype==='touch'&&Math.abs(dx)<12&&Math.abs(dy)<12&&dt<450){
      if(barVisible)barOff(true);
      else if(cfg.controls==='hidden')setMode('auto',true);
      else barOn();
    }
  }
  function pc(){sx=null;}
  function fit(){
    var r=area.getBoundingClientRect();
    scale=Math.min(r.width/W,r.height/H)||1;
    wrap.style.width=W*scale+'px'; wrap.style.height=H*scale+'px';
    stage.style.transform='scale('+scale+')';
  }
  function full(){
    if(isModalOpen())return;
    if(document.fullscreenElement)document.exitFullscreen();
    else if(mount.requestFullscreen)mount.requestFullscreen();
  }
  function setAuto(on){
    if(auto){clearInterval(auto);auto=null;}
    if(on)auto=setInterval(function(){
      if(busy||isModalOpen())return;
      if(idx<deck.slides.length-1||cfg.loop)go(idx+1); else setAuto(false);
    },4200);
    autoBtn.classList.toggle('on',!!auto);
  }
  function key(ev){
    if(dead||isModalOpen())return;
    const typing=/INPUT|TEXTAREA|SELECT/.test(ev.target.tagName)||ev.target.isContentEditable;
    if(typing)return;
    var k=ev.key;
    if(k==='ArrowRight'||k==='PageDown'||k===' '){ev.preventDefault();go(idx+1);}
    else if(k==='ArrowLeft'||k==='PageUp'){ev.preventDefault();go(idx-1);}
    else if(k==='Home'){go(0);barOn();}
    else if(k==='End'){go(deck.slides.length-1);barOn();}
    else if(k==='h'||k==='H'||k==='р'||k==='Р'){setMode(cfg.controls==='auto'?'always':cfg.controls==='always'?'hidden':'auto');}
    else if(k==='n'||k==='N'||k==='т'||k==='Т'){notesEl.classList.toggle('on');barOn();}
    else if(k==='a'||k==='A'||k==='ф'||k==='Ф'){setAuto(!auto);barOn();toast(auto?'Автопоказ включён':'Автопоказ выключен');}
    else if(k==='l'||k==='L'||k==='д'||k==='Д'){setLoop(!cfg.loop);barOn();}
    else if(k==='f'||k==='F'||k==='а'||k==='А'){full();barOn();}
    else if(k==='Escape'){if(document.fullscreenElement)document.exitFullscreen();else if(opts.onExit)opts.onExit();}
  }
  var wt=0;
  function wh(ev){
    if(isModalOpen())return;
    if(Math.abs(ev.deltaY)<24)return;var t=Date.now();if(t-wt<650)return;wt=t;go(idx+(ev.deltaY>0?1:-1));
  }
  function rs(){fit();}

  document.addEventListener('keydown',key);
  addEventListener('resize',rs);
  document.addEventListener('fullscreenchange',rs);
  area.addEventListener('pointermove',move);
  area.addEventListener('pointerleave',leaveArea);
  area.addEventListener('pointerdown',pd);
  area.addEventListener('pointerup',pu);
  area.addEventListener('pointercancel',pc);
  area.addEventListener('wheel',wh,{passive:true});
  bar.addEventListener('pointerenter',function(){overBar=true;clearTimeout(hideT);});
  bar.addEventListener('pointerleave',function(){overBar=false;schedule();});
  bar.addEventListener('focusin',function(){focusBar=true;clearTimeout(hideT);});
  bar.addEventListener('focusout',function(){focusBar=false;schedule();});
  hint.addEventListener('click',function(){
    if(isModalOpen())return;
    if(cfg.controls==='hidden')setMode('auto',true);barOn();
  });
  bar.addEventListener('click',function(ev){
    if(isModalOpen())return;
    var b=ev.target.closest('[data-a]'); if(!b)return;
    var a=b.dataset.a;
    if(a==='prev')go(idx-1); else if(a==='next')go(idx+1);
    else if(a==='notes')notesEl.classList.toggle('on');
    else if(a==='full')full();
    else if(a==='auto'){setAuto(!auto);toast(auto?'Автопоказ включён':'Автопоказ выключен');}
    else if(a==='loop')setLoop(!cfg.loop);
    else if(a==='mode')setMode(cfg.controls==='auto'?'always':cfg.controls==='always'?'hidden':'auto');
    else if(a==='exit'&&opts.onExit)opts.onExit();
    if(a!=='mode')schedule();
  });

  fit(); show(opts.start||0,true); applyCfg();
  toast(cfg.controls==='hidden'?'Панель скрыта · H — вернуть':'Кромка '+(cfg.pos==='top'?'сверху':'снизу')+' — панель · H — режим',3200);

  return {
    next:function(){go(idx+1);}, prev:function(){go(idx-1);}, goTo:go,
    replay:function(){show(idx,true);},
    preview:function(t){t=clamp(t,0,deck.slides.length-1);if(t>0){show(t-1,false);setTimeout(function(){go(t);},420);}else show(t,true);},
    settings:function(next){for(var k in next){if(k in DEF)cfg[k]=next[k];}applyCfg();},
    auto:function(on){setAuto(!!on);},
    loop:function(on){setLoop(!!on,true);},
    fit:fit, index:function(){return idx;},
    destroy:function(){
      dead=true; activeFinish=null; setAuto(false);
      clearTimeout(hideT);clearTimeout(cursorT);clearTimeout(toastT);
      anims.concat(transAnims).forEach(function(a){try{a.cancel();}catch(e){}});
      stage.querySelectorAll('.wdp-layer').forEach(sleep);
      document.removeEventListener('keydown',key);
      removeEventListener('resize',rs);
      document.removeEventListener('fullscreenchange',rs);
      area.removeEventListener('pointermove',move);
      area.removeEventListener('pointerleave',leaveArea);
      area.removeEventListener('pointerdown',pd);
      area.removeEventListener('pointerup',pu);
      area.removeEventListener('pointercancel',pc);
      area.removeEventListener('wheel',wh);
      mount.innerHTML=''; mount.classList.remove('wdp','wdp-top');
    }
  };
};
Player(DECK,document.getElementById("deck"),{standalone:true,widgets:false});
</script>
